name: Build installers
on:
  workflow_dispatch:
  push:
    branches: [ 'claude/**' ]
    paths: [ 'src/AMGH.ITInventory.Desktop/**', 'src/AMGH.ITInventory.Mobile/**', 'src/AMGH.ITInventory.Shared/**', 'installer/**', '.github/workflows/installers.yml' ]
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Publish (self-contained, win-x64)
        run: dotnet publish src/AMGH.ITInventory.Desktop -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/desktop
      - name: Build installer (Inno Setup)
        env: { APP_VERSION: "1.0.${{ github.run_number }}" }
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\AmghDesktop.iss
      - uses: actions/upload-artifact@v4
        with: { name: AMGH-Desktop-Windows, path: artifacts/installer/*.exe }
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: actions/setup-java@v4
        with: { distribution: microsoft, java-version: '17' }
      - run: dotnet workload install maui-android
      - name: Signing key (repo secrets, else a throwaway key for sideload testing)
        shell: pwsh
        env: { KS_B64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}", KS_PASS: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" }
        run: |
          if ($env:KS_B64) { [IO.File]::WriteAllBytes("amgh.keystore", [Convert]::FromBase64String($env:KS_B64)); $pass = $env:KS_PASS; $alias = "amgh" }
          else { $pass = "throwaway-" + [guid]::NewGuid().ToString("N"); $alias = "amgh"
                 keytool -genkeypair -v -keystore amgh.keystore -alias $alias -keyalg RSA -keysize 2048 -validity 10000 -storepass $pass -keypass $pass -dname "CN=AMGH IT,O=AMGH" }
          "KS_PASS_RES=$pass" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Publish APK
        run: >
          dotnet publish src/AMGH.ITInventory.Mobile -f net8.0-android -c Release -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$PWD/amgh.keystore -p:AndroidSigningKeyAlias=amgh
          -p:AndroidSigningKeyPass=env:KS_PASS_RES -p:AndroidSigningStorePass=env:KS_PASS_RES -o artifacts/android
      - uses: actions/upload-artifact@v4
        with: { name: AMGH-Android-APK, path: artifacts/android/*-Signed.apk }
